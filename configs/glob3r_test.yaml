name: glob3r_test
trainer: trainers.glob3r_trainer.Glob3RTrainer
work_dir: ${hydra:runtime.cwd}
working_dir: ${work_dir}
random_seed: 1111
scannet_root: ???

log:
  output_dir: ${work_dir}/outputs/${name}
  ckpt_dir: ${work_dir}/outputs/${name}/ckpts
  use_tensorboard: true
  use_wandb: false
  wandb_init_conf: {}
  summary_interval: 1
  ckpt_interval: 1
  max_checkpoints: 1

hydra:
  run:
    dir: ${log.output_dir}

  job_logging:
    handlers:
      file:
        filename: ${log.output_dir}/log.log

model:
  _target_: pi3.models.pi3_training.Pi3
  pos_type: rope100
  decoder_size: large
  load_vggt: false
  freeze_encoder: false
  use_global_points: false
  train_conf: false
  num_dec_blk_not_to_checkpoint: 4
  ckpt: null

glob3r:
  backbone_checkpoint: null
  encoder_layers: [5, 11, 17, 23]
  stage: coarse
  enable_refinement: true
  matching_checkpoint: null
  romav2_refinement_checkpoint: null
  require_pretrained_backbone: true
  visualization:
    enabled: true
    interval_steps: 100
    target_offset: 0
    num_samples: 1
    num_targets: 1
    confidence_threshold: 0.5
    cell_width: 160

loss:
  train_loss: &matching_loss
    _target_: pi3.models.glob3r.loss.Glob3RMatchingLoss
    lambda_nll: 1.0
    lambda_warp: 1.0
    lambda_confidence: 1.0
    depth_threshold: 0.05
    charbonnier_epsilon: 1.0e-3
    charbonnier_alpha: 0.5
  test_loss:
    <<: *matching_loss

train:
  image_num_range: [2, 2]
  max_img_per_gpu: 2
  resolution: [[224, 224]]
  random_reslution: false
  patch_size: 14
  num_resolution: 1
  num_epoch: 5
  iters_per_epoch: 800
  gradient_accumulation_steps: 1
  num_workers: 1
  batch_size: 1
  print_freq: 40
  base_seed: 666
  model_dtype: bf16
  dynamo_backend: NO
  dynamic_compile: false
  clip_grad: 1.0
  clip_loss: 10
  seed: 42
  resume: null
  auto_resume: false
  start_epoch: 0
  global_step: 0
  world_size: 1
  rank: -1
  gpu: -1
  dist_on_itp: false
  find_unused_parameters: false
  distributed: false
  dist_url: env://
  dist_backend: nccl
  optimizer:
    type: AdamW
    lr: 1.0e-4
    weight_decay: 5.0e-2
    betas: [0.9, 0.95]
    verbose: true
    filter_bias_and_bn: true
  lr_scheduler:
    type: CosineWithWarmupLR
    total_steps: -1
    warmup_steps: 2000
    accumulation_steps: 1
    min_factor: 0.0

test:
  num_workers: 1
  batch_size: 1
  print_freq: 1
  iters_per_test: 1

train_dataset:
  length: 1000
  weights: {ScanNet: 2}
  ScanNet:
    _target_: datasets.glob3r_scannet_dataset.Glob3RScannetValidationDataset
    data_root: ${scannet_root}
    z_far: 80
    frame_num: 2
    frame_step: 1
    sample_seed: 0
    aug_crop: false
    aug_focal: false
    transform:
      _partial_: true
      _target_: datasets.base.transforms.ImgToTensor
    mode: train

train_dataloader:
  drop_last: true
  shuffle: true

test_dataset:
  length: 8
  weights: {ScanNet: 8}
  ScanNet:
    _target_: datasets.glob3r_scannet_dataset.Glob3RScannetValidationDataset
    data_root: ${scannet_root}
    z_far: 80
    frame_num: 2
    frame_step: 1
    sample_seed: 0
    aug_crop: false
    aug_focal: false
    resolution: [[224, 224]]
    transform:
      _partial_: true
      _target_: datasets.base.transforms.ImgToTensor
    mode: test

test_dataloader:
  drop_last: false
  shuffle: false
