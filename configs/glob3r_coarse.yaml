defaults:
  - general: default
  - extras: default
  - override hydra/job_logging: custom
  - override hydra/hydra_logging: colorlog
  - _self_

name: glob3r_coarse
trainer: trainers.glob3r_trainer.Glob3RTrainer

# Frozen Pi3 backbone and the Glob3R track-matching branch.
model:
  _target_: pi3.models.pi3_training.Pi3
  pos_type: rope100
  decoder_size: large
  load_vggt: false
  freeze_encoder: false
  use_global_points: false
  train_conf: false
  num_dec_blk_not_to_checkpoint: 4
  ckpt: null

glob3r:
  backbone_checkpoint: null
  encoder_layers: [5, 11, 17, 23]
  stage: coarse
  enable_refinement: true
  matching_checkpoint: null
  romav2_refinement_checkpoint: null
  require_pretrained_backbone: true
  visualization:
    enabled: true
    interval_steps: 500
    target_offset: 0
    num_samples: 1
    num_targets: 7
    confidence_threshold: 0.5
    cell_width: 160

loss:
  train_loss: &matching_loss
    _target_: pi3.models.glob3r.loss.Glob3RMatchingLoss
    lambda_nll: 1.0
    lambda_warp: 1.0
    lambda_confidence: 1.0
    depth_threshold: 0.05
    charbonnier_epsilon: 1.0e-3
    charbonnier_alpha: 0.5
  test_loss:
    <<: *matching_loss

# Appendix B coarse stage: 64K micro-steps / accumulation 2 = 32K updates.
train:
  image_num_range: [2, 48]
  max_img_per_gpu: 48
  resolution:
    [[182, 518], [210, 518], [238, 518], [266, 518], [294, 518],
     [322, 518], [350, 518], [378, 518], [406, 518], [434, 518],
     [462, 518], [490, 518], [518, 518]]
  random_reslution: false
  patch_size: 14
  num_resolution: 13
  num_epoch: 80
  iters_per_epoch: 800
  gradient_accumulation_steps: 2
  num_workers: 16
  batch_size: 1
  print_freq: 40
  base_seed: 666
  model_dtype: bf16
  dynamo_backend: NO
  dynamic_compile: true
  clip_grad: 1.0
  clip_loss: 10
  seed: 42
  resume: null
  auto_resume: true
  start_epoch: 0
  global_step: 0
  world_size: 1
  rank: -1
  gpu: -1
  dist_on_itp: false
  find_unused_parameters: false
  distributed: false
  dist_url: env://
  dist_backend: nccl
  optimizer:
    type: AdamW
    lr: 1.0e-4
    weight_decay: 5.0e-2
    betas: [0.9, 0.95]
    verbose: true
    filter_bias_and_bn: true
  lr_scheduler:
    type: CosineWithWarmupLR
    total_steps: -1
    warmup_steps: 2000
    accumulation_steps: 2
    min_factor: 0.0

test:
  num_workers: 16
  batch_size: 1
  print_freq: 10
  iters_per_test: -1

# Replace this example mixture with the full Appendix-B training data.
train_dataset:
  length: 10000000
  weights: {TarTanAir: 8000, ScanNet: 20000, CO3DV2: 10000}
  TarTanAir:
    _target_: datasets.tartanair_dataset.TarTanAirDataset
    z_far: 80
    frame_num: 8
    aug_crop: 16
    aug_focal: 0.9
    transform: &train_transform
      _partial_: true
      _target_: datasets.glob3r_transforms.Glob3RImageTransform
    mode: train
  ScanNet:
    _target_: datasets.scannet_dataset.ScannetDataset
    z_far: 80
    frame_num: 8
    aug_crop: 16
    aug_focal: 0.9
    transform:
      <<: *train_transform
    mode: train
  CO3DV2:
    _target_: datasets.co3dv2_dataset.CO3DV2Dataset
    z_far: 0
    frame_num: 8
    aug_crop: 16
    aug_focal: 0.9
    transform:
      <<: *train_transform
    mode: train

train_dataloader:
  drop_last: true
  shuffle: true

test_dataset:
  weights: {ScanNet: 2000}
  ScanNet:
    _target_: datasets.scannet_dataset.ScannetDataset
    z_far: 80
    frame_num: 8
    resolution: [[518, 336]]
    transform:
      _partial_: true
      _target_: datasets.base.transforms.ImgToTensor
    mode: test

test_dataloader:
  drop_last: false
  shuffle: false
