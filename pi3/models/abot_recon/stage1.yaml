  #   data_root: null
  #   max_distance: 240
  #   z_far: 80
  #   frame_num: 32
  #   shuffle: false
  #   random_sample_thres: 0.0
  #   aug_crop: 0
  #   aug_focal: 0.9
  #   transform: *abot_train_transform
  #   mode: train
  # WaymoABotRecon:
