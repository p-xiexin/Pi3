  #   mode: train

train_dataloader:
  drop_last: true
  shuffle: true

test_dataset:
  weights:
    KITTIABotRecon: 2000
  KITTIABotRecon:
    _target_: pi3.models.abot_recon.dataset.KITTIABotReconDataset
    raw_root: ${train_dataset.KITTIABotRecon.raw_root}
    depth_root: ${train_dataset.KITTIABotRecon.depth_root}
    index_file: ${train_dataset.KITTIABotRecon.index_file}
    cameras: [image_02]
    splits: [val]
    frame_step: 1
    splat_radius: 0
    z_far: 80
    frame_num: 8
    shuffle: false
    aug_crop: 0
    aug_focal: 1.0
    resolution: [[504, 280]]
    transform: &abot_test_transform
      _partial_: true
      _target_: datasets.base.transforms.ImgToTensor
    mode: test

test_dataloader:
  drop_last: false
  shuffle: false

abot_recon:
  visualization:
    enabled: true
    interval_steps: 100
    num_samples: 1
    num_frames: 8
    cell_width: 160
    relative_error_max: 0.2
    pose_camera_scale: 0.14
    # evo uses the XZ trajectory plane for KITTI. Embed it horizontally in 3D.
    pose_plot_mode: xz

data_viz:
  dataset_name: KITTIABotRecon
  output_dir: ${work_dir}/outputs/abot_recon_dataset_viz
  sample_index: 0
  num_samples: 1
  frame_num: 8
  cell_width: 240
  max_frames: 8
  show: false

log:
  output_dir: ${work_dir}/outputs/${name}
  use_tensorboard: true
  use_wandb: false
  wandb_init_conf:
    name: ${name}
    entity: null
    project: ${name}
  summary_interval: 1
  ckpt_interval: 10
  max_checkpoints: 3
  ckpt_dir: ${log.output_dir}/ckpts

hydra:
  run:
    dir: ${log.output_dir}
  job:
    chdir: false
  job_logging:
    handlers:
      file:
        filename: ${log.output_dir}/train.log
