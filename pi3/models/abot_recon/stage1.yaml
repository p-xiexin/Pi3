name: abot_recon_stage1
work_dir: ${hydra:runtime.cwd}
working_dir: ${work_dir}
random_seed: 1111

model:
  _target_: pi3.models.abot_recon.model.ABotRecon
  pos_type: rope100
  decoder_size: large
  load_vggt: false
  load_pi3: ???
  ckpt: null
  freeze_encoder: false
  enable_confidence: false
  confidence_only_train: false
  enable_rotation_refiner: false
  adj_pose_head_to_ckpt: false
  local_window_frames: 12
  num_dec_blk_not_to_checkpoint: 4
  point_z_log_max: 10.0
  global_pos_encoding: rope3d
  rope3d_fhw_dim: [20, 22, 22]
  max_frames: 4096
  gate_layers: null

loss:
  train_loss:
    _target_: pi3.models.abot_recon.loss.ABotReconLoss
    point_weight: 1.0
    normal_weight: 1.0
    pose_weight: 0.1
    smooth_weight: 0.1
    confidence_weight: 0.0
    translation_weight: 100.0
    rotation_weight: 1.0
    max_pair_gap: 12
    gap_gamma: 0.5
    smooth_temporal_weight: 1.0
    confidence_error_threshold: 0.02
    huber_delta: 0.1
    local_align_res: 4096
  test_loss:
    ${loss.train_loss}

train:
  image_num_range: [32, 32]
  max_img_per_gpu: 32
  resolution: [[504, 280]]
  random_reslution: false
  num_resolution: 1
  num_workers: 16
  batch_size: 1
  num_epoch: 32
  iters_per_epoch: 1000
  print_freq: 40
  base_seed: 666
  model_dtype: bf16
  # Existing Stage I checkpoints predate EMA. Enable this for a new Stage II run.
  use_ema: false
  ema_decay: 0.999
  dynamo_backend: NO
  dynamic_compile: false
  gradient_accumulation_steps: 1
  clip_grad: 1.0
  clip_loss: 10
  seed: 42
  resume: null
  auto_resume: true
  start_epoch: 0
  global_step: 0
  world_size: 1
  rank: -1
  gpu: -1
  dist_on_itp: false
  find_unused_parameters: false
  distributed: false
  dist_url: env://
  dist_backend: nccl
  optimizer:
    type: AdamW
    lr: 1e-4
    encoder_lr: 1e-4
    refiner_lr: 1e-4
    weight_decay: 5e-2
    betas: [0.9, 0.95]
    verbose: true
    filter_bias_and_bn: true
  lr_scheduler:
    type: OneCycleLR
    max_lr: ${train.optimizer.lr}
    pct_start: 0.0
    anneal_strategy: cos
    div_factor: 1.0
    final_div_factor: 100.0
    total_steps: -1

test:
  image_num_range: [8, 8]
  max_img_per_gpu: 32
  num_workers: 8
  batch_size: 1
  print_freq: 10
  iters_per_test: -1

train_dataset:
  length: 10000000
  # Keep only datasets with valid local paths in this mapping. Table 1 relative
  # weights for the migrated datasets are TartanAir 672, ScanNet 246,
  # Waymo 538 and BlendedMVS 247.
  weights:
    KITTIABotRecon: 100000
  KITTIABotRecon:
    _target_: pi3.models.abot_recon.dataset.KITTIABotReconDataset
    raw_root: ???
    depth_root: ???
    index_file: null
    cameras: [image_02]
    splits: [train]
    frame_step: 1
    splat_radius: 0
    z_far: 80
    frame_num: 32
    shuffle: false
    aug_crop: 0
    aug_focal: 0.9
    transform: &abot_train_transform
      _partial_: true
      _target_: datasets.base.transforms.JitterJpegLossBlurring
    mode: train
  # TartanAirABotRecon:
